# .github/workflows/backend-ci.yml

name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    # Make sure SQLx macros and your code see these at compile time
    env:
      DATABASE_URL: postgres://pguser:pgpass@localhost:5432/patentrag
      REDIS_URL: redis://127.0.0.1:6379/
      OPENAI_API_KEY: ci_dummy_key

    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: patentrag
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Wait for services to be healthy
        run: sleep 10

      - name: Run database migrations
        run: |
          cd backend
          # if you have SQLx migrations:
          cargo install sqlx-cli --no-default-features --features postgres
          sqlx database create
          sqlx migrate run

      - name: Verify build
        run: |
          cd backend
          cargo check --locked --verbose

      - name: Run tests
        run: |
          cd backend
          cargo test --locked --verbose
