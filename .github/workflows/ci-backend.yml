name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: pguser
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: patentrag
        # wait until Postgres is ready
        options: >-
          --health-cmd "pg_isready -U pguser"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        # wait until Redis is ready
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5

    env:
      DATABASE_URL: postgres://pguser:pgpass@localhost:5432/patentrag
      REDIS_URL: redis://127.0.0.1:6379/
      OPENAI_API_KEY: ci_dummy_key

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Wait for services to be healthy
        run: sleep 10

      - name: Verify build and tests
        run: |
          cd backend
          cargo test --locked --verbose
