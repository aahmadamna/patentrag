services:
  - type: web
    name: patentrag-backend
    env: rust
    buildCommand: cargo build --release
    startCommand: ./target/release/backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: patentrag-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: patentrag-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: patentrag-postgres
    databaseName: patentrag
    user: patentrag

services:
  - type: redis
    name: patentrag-redis 