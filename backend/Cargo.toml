[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
lopdf = "0.26"
pdf-extract = "0.6"
sqlx = { version = "0.6", features = ["postgres", "runtime-tokio-native-tls", "uuid", "time"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "0.23", features = ["aio", "tokio-comp"] }
sha2 = "0.10"
hex = "0.4"
axum = "0.6"
axum-extra = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.3", features = ["cors", "add-extension"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }
tempfile = "3.20.0"
regex = "1.11.1"
